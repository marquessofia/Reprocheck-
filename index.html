<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14284B">
  <title>ReproCheck — registro de reparos</title>
  <style>
    :root {
      --azul: #14284B;
      --azul-toque: #1F3A68;
      --laranja: #F28C1E;
      --laranja-toque: #D9740A;
      --fundo: #F5F3EF;
      --cartao: #FFFFFF;
      --texto: #1B2433;
      --secundario: #5B6677;
      --linha: #D9D5CC;
      --erro: #B64F4F;
      --erro-fundo: #FCEBE9;
      --sombra: 0 8px 24px rgba(20,40,75,.10);
      --sombra-curta: 0 4px 12px rgba(20,40,75,.10);
      --raio-cartao: 20px;
      --raio-botao: 16px;
      --fonte: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--fundo); color: var(--texto); font-family: var(--fonte); }
    body { min-height: 100vh; }
    button, select, input { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 4px solid rgba(242,140,30,.50); outline-offset: 3px; }
    button:active { transform: translateY(1px) scale(.985); }

    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { flex: 0 0 auto; min-height: 80px; padding: 16px clamp(22px, 5vw, 72px) 13px; background: var(--azul); border-bottom: 4px solid var(--laranja); color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 13px; font-size: clamp(24px, 2.5vw, 32px); font-weight: 850; letter-spacing: -.04em; white-space: nowrap; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid var(--laranja); border-radius: 11px; color: var(--laranja); }
    .brand-mark svg { width: 23px; height: 23px; }
    .context { color: rgba(255,255,255,.84); font-size: clamp(15px, 1.5vw, 20px); font-weight: 650; text-align: right; max-width: 72%; line-height: 1.25; }

    .page { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: clamp(28px, 5vh, 54px) 0 36px; flex: 1; display: flex; flex-direction: column; }
    .page.narrow { width: min(820px, calc(100% - 48px)); }
    .page-title { margin: 0; font-size: clamp(29px, 3vw, 38px); line-height: 1.12; letter-spacing: -.035em; font-weight: 850; }
    .page-lead { margin: 10px 0 0; color: var(--secundario); font-size: clamp(18px, 1.8vw, 22px); line-height: 1.4; }
    .title-block { margin-bottom: 28px; }
    .accepted { display: inline-flex; align-items: center; gap: 9px; margin-top: 13px; padding: 9px 13px; border-radius: 999px; background: #E7F1EB; color: #246443; font-weight: 800; font-size: 17px; }
    .accepted::before { content: "✓"; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #3B8961; color: white; }
    .error-message { margin: 16px 0 0; padding: 13px 16px; border-radius: 12px; background: var(--erro-fundo); color: var(--erro); font-weight: 750; font-size: 18px; border-left: 5px solid var(--erro); }

    .menu-layout { width: min(760px, 100%); margin: auto; align-self: center; }
    .menu-layout .page-title { text-align: center; }
    .menu-subtitle { text-align: center; margin: 13px 0 34px; color: var(--secundario); font-size: 20px; }
    .menu-stack { display: grid; gap: 16px; }
    .menu-small { display: flex; justify-content: center; margin-top: 11px; }

    .nav-button, .primary-button, .secondary-button, .choice-button, .key-button, .list-row, .condition-row { border: 0; transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease; }
    .nav-button { min-height: 88px; width: 100%; padding: 18px 26px; border-radius: var(--raio-botao); background: var(--azul); color: #fff; font-size: clamp(22px, 2.2vw, 30px); font-weight: 780; display: flex; align-items: center; justify-content: center; gap: 16px; box-shadow: var(--sombra-curta); }
    .nav-button:hover { background: var(--azul-toque); box-shadow: 0 7px 18px rgba(20,40,75,.16); }
    .nav-icon { width: 30px; height: 30px; color: var(--laranja); flex: 0 0 auto; }
    .nav-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    .primary-button { min-height: 82px; padding: 16px 28px; border-radius: var(--raio-botao); background: var(--laranja); color: var(--azul); font-size: clamp(22px, 2.1vw, 30px); font-weight: 850; box-shadow: 0 7px 16px rgba(217,116,10,.22); }
    .primary-button:hover { background: #F59B35; box-shadow: 0 9px 20px rgba(217,116,10,.27); }
    .primary-button.full { width: 100%; }
    .secondary-button { min-height: 58px; padding: 12px 20px; border: 2px solid var(--azul); border-radius: 12px; background: var(--cartao); color: var(--azul); font-size: 19px; font-weight: 800; }
    .secondary-button:hover { background: #EEF2F8; }
    .secondary-button.subtle { border-color: var(--linha); color: var(--secundario); }
    .button-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .button-row.center { justify-content: center; }
    .button-row.between { justify-content: space-between; }
    .footer-actions { margin-top: 24px; }

    .panel { background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio-cartao); padding: clamp(20px, 3vw, 32px); box-shadow: var(--sombra); }
    .center-panel { width: min(760px, 100%); margin: auto; }
    .choice-panel { padding: clamp(22px, 3vw, 36px); }
    .question { margin: 0 0 24px; text-align: center; font-size: clamp(28px, 3vw, 36px); line-height: 1.15; letter-spacing: -.03em; }
    .panel-heading { margin: 0; font-size: 27px; line-height: 1.2; letter-spacing: -.025em; }
    .helper { margin: 7px 0 0; color: var(--secundario); font-size: 18px; line-height: 1.4; }
    .summary { display: inline-flex; flex-wrap: wrap; max-width: 100%; gap: 5px; align-items: center; margin: 0 0 22px; color: var(--secundario); font-size: 18px; font-weight: 750; line-height: 1.45; }
    .summary strong { color: var(--azul); }
    .summary .sep { color: var(--laranja); font-size: 21px; }

    .choice-grid { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; min-height: 80px; max-height: min(48vh, 455px); overflow-y: auto; padding: 4px 10px 22px 4px; scrollbar-width: auto; scrollbar-color: var(--azul) #E8E4DC; }
    .choice-grid::after { content: ""; position: sticky; display: block; height: 28px; bottom: 0; grid-column: 1 / -1; margin: -50px 0 0; pointer-events: none; background: linear-gradient(transparent, rgba(255,255,255,.98)); }
    .choice-grid::-webkit-scrollbar, .scroll-region::-webkit-scrollbar { width: 18px; }
    .choice-grid::-webkit-scrollbar-track, .scroll-region::-webkit-scrollbar-track { background: #E8E4DC; border-radius: 20px; }
    .choice-grid::-webkit-scrollbar-thumb, .scroll-region::-webkit-scrollbar-thumb { background: var(--azul); border-radius: 20px; border: 3px solid #E8E4DC; }
    .choice-button { min-height: 76px; padding: 13px 16px; border: 2px solid #CCD2DB; border-radius: 14px; background: #fff; color: var(--azul); font-size: clamp(19px, 1.7vw, 23px); line-height: 1.16; font-weight: 800; text-align: left; overflow-wrap: anywhere; box-shadow: 0 2px 0 rgba(20,40,75,.03); }
    .choice-button:hover { border-color: var(--azul); background: #F6F8FB; }
    .choice-button:active { background: var(--laranja); border-color: var(--laranja-toque); color: var(--azul); }
    .choice-button.long { font-size: 19px; }
    .choice-button .minor { display: block; color: var(--secundario); font-size: 16px; font-weight: 650; margin-top: 4px; }

    .context-strip { margin-bottom: 26px; padding: 13px 17px; border-radius: 13px; background: rgba(20,40,75,.07); color: var(--azul); font-size: 18px; font-weight: 780; line-height: 1.35; border-left: 5px solid var(--laranja); }
    .record-layout { width: min(860px, 100%); margin: auto; }
    .record-hero { background: var(--cartao); border: 1px solid var(--linha); border-radius: 24px; padding: clamp(28px, 5vw, 54px); box-shadow: var(--sombra); text-align: center; }
    .record-hero .primary-button { width: min(620px, 100%); min-height: 150px; font-size: clamp(30px, 4vw, 48px); }
    .record-icon { width: 60px; height: 60px; margin: 0 auto 15px; color: var(--laranja); }
    .record-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .record-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 24px; }

    .form-stack { display: grid; gap: 18px; }
    .field-label { display: block; margin-bottom: 8px; color: var(--secundario); font-size: 18px; font-weight: 800; }
    .select-wrap { position: relative; }
    .select-wrap::after { content: "⌄"; position: absolute; right: 20px; top: 50%; transform: translateY(-55%); color: var(--azul); pointer-events: none; font-size: 28px; font-weight: 900; }
    select, .text-input { width: 100%; min-height: 66px; padding: 12px 52px 12px 18px; border: 2px solid var(--linha); border-radius: 13px; color: var(--azul); background: #fff; font-size: 23px; font-weight: 750; appearance: none; }
    .text-input { padding-right: 18px; appearance: auto; }
    select:focus, .text-input:focus { border-color: var(--azul); }

    .keypad-wrap { width: min(470px, 100%); margin: 0 auto; }
    .dots { min-height: 74px; padding: 10px 20px; display: flex; align-items: center; justify-content: center; gap: 15px; border: 2px solid var(--linha); border-radius: 14px; background: #fff; color: var(--laranja); font-size: 39px; letter-spacing: 9px; font-weight: 900; margin-bottom: 16px; }
    .dots .empty { color: #C9C7C1; letter-spacing: 3px; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .key-button { min-height: 74px; border: 2px solid var(--azul); border-radius: 12px; background: #fff; color: var(--azul); font-size: 27px; font-weight: 850; }
    .key-button:hover { background: #EEF2F8; }
    .key-button.ok { background: var(--laranja); border-color: var(--laranja); }
    .key-button.clear { color: var(--secundario); border-color: var(--linha); font-size: 19px; }

    .in-progress { width: min(850px, 100%); margin: auto; }
    .status-card { padding: clamp(24px, 4vw, 40px); text-align: center; background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio-cartao); box-shadow: var(--sombra); }
    .symptom-line { margin: 14px 0 25px; color: var(--secundario); font-size: 20px; line-height: 1.4; }
    .symptom-line strong { color: var(--azul); }
    .timer-label { margin: 0 0 5px; color: var(--secundario); font-weight: 750; font-size: 18px; }
    .timer { margin: 0 0 23px; color: var(--azul); font-size: clamp(44px, 6vw, 68px); line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
    .timer.paused { color: var(--secundario); }
    .progress-main { margin-top: 24px; }

    .step-card { width: min(1110px, 100%); margin: auto; }
    .step-card .choice-grid { max-height: min(47vh, 420px); }
    .step-card .summary { margin-bottom: 14px; }
    .step-kicker { color: var(--secundario); font-size: 18px; font-weight: 800; margin: 0 0 11px; }
    .review-card { width: min(800px, 100%); margin: auto; }
    .review-route { padding: 18px 20px; border-radius: 14px; background: #F8F8F6; border: 1px solid var(--linha); color: var(--azul); font-size: 23px; font-weight: 800; line-height: 1.42; overflow-wrap: anywhere; }
    .review-label { margin: 22px 0 8px; color: var(--secundario); font-size: 18px; font-weight: 800; }
    .time-edit { display: flex; align-items: center; gap: 10px; }
    .time-edit input { flex: 1; min-height: 66px; padding: 10px 16px; border: 2px solid var(--linha); border-radius: 13px; font-size: 26px; color: var(--azul); font-weight: 800; }
    .time-unit { color: var(--secundario); font-size: 22px; font-weight: 750; }

    .scroll-region { max-height: min(57vh, 530px); overflow-y: auto; padding: 4px 11px 18px 4px; scrollbar-width: auto; scrollbar-color: var(--azul) #E8E4DC; }
    .list-stack { display: grid; gap: 13px; }
    .list-row { width: 100%; min-height: 91px; padding: 15px 18px; display: grid; grid-template-columns: minmax(95px, 125px) 1fr auto; align-items: center; gap: 18px; text-align: left; border: 1px solid var(--linha); border-radius: 15px; background: #fff; color: var(--texto); box-shadow: 0 3px 10px rgba(20,40,75,.05); }
    .list-row.open-old { border-left: 8px solid var(--laranja); padding-left: 12px; }
    .list-row:hover { border-color: var(--azul); background: #FBFCFE; }
    .list-row.clickable { cursor: pointer; }
    .row-time { color: var(--azul); font-size: 21px; font-weight: 900; white-space: nowrap; }
    .row-main { min-width: 0; font-size: 19px; line-height: 1.35; overflow-wrap: anywhere; }
    .row-main strong { display: block; color: var(--texto); font-size: 21px; }
    .row-meta { display: block; color: var(--secundario); font-size: 16px; margin-top: 3px; }
    .row-end { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; text-align: right; }
    .situation { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 11px; border-radius: 999px; font-size: 16px; font-weight: 850; white-space: nowrap; }
    .situation.open { background: #FFF0D9; color: #9A560A; }
    .situation.done { background: var(--azul); color: #fff; }
    .finalize-link { color: var(--azul); font-size: 18px; font-weight: 900; white-space: nowrap; }
    .empty-state { min-height: 180px; display: grid; place-items: center; border: 2px dashed var(--linha); border-radius: 15px; color: var(--secundario); text-align: center; font-size: 20px; padding: 24px; }

    .leader-options { width: min(760px, 100%); margin: auto; }
    .leader-options .menu-stack { margin-top: 28px; }
    .leader-note { margin-top: 22px; color: var(--secundario); text-align: center; font-size: 18px; }
    .condition-page { width: min(1080px, 100%); margin: auto; }
    .condition-selectors { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; margin: 20px 0 28px; }
    .condition-selectors .nav-button { min-height: 98px; font-size: 23px; }
    .active-title { margin: 0 0 12px; font-size: 26px; }
    .condition-row { min-height: 87px; padding: 14px 17px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--linha); border-radius: 15px; box-shadow: 0 3px 10px rgba(20,40,75,.05); }
    .condition-row + .condition-row { margin-top: 11px; }
    .condition-name { font-size: 19px; font-weight: 800; line-height: 1.28; overflow-wrap: anywhere; }
    .condition-name small { display: block; margin-top: 4px; color: var(--secundario); font-weight: 650; font-size: 16px; }
    .condition-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .tag-waiting { display: inline-flex; margin-top: 7px; padding: 5px 9px; border-radius: 999px; background: #FFF0D9; color: #9A560A; font-size: 15px; font-weight: 850; }
    .tiny-button { min-height: 52px; padding: 9px 13px; border: 2px solid var(--azul); border-radius: 10px; color: var(--azul); background: #fff; font-size: 17px; font-weight: 850; }
    .tiny-button:hover { background: #EEF2F8; }

    .end-day { width: min(690px, 100%); margin: auto; }
    .day-summary { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin: 27px 0; }
    .summary-stat { min-height: 105px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: #fff; border: 1px solid var(--linha); border-radius: 16px; }
    .summary-stat strong { color: var(--azul); font-size: 38px; line-height: 1; }
    .summary-stat span { margin-top: 6px; color: var(--secundario); font-size: 17px; font-weight: 750; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: rgba(10,20,36,.68); }
    .modal-card { width: min(570px, 100%); max-height: calc(100vh - 48px); overflow: auto; padding: clamp(22px, 4vw, 35px); border-radius: 21px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .modal-card h2 { margin: 0 0 7px; color: var(--azul); text-align: center; font-size: 30px; }
    .modal-card .helper { text-align: center; margin-bottom: 18px; }
    .modal-card .dots { margin-bottom: 14px; }
    .modal-error { margin: 12px 0; padding: 10px 12px; text-align: center; border-radius: 10px; background: var(--erro-fundo); color: var(--erro); font-size: 17px; font-weight: 800; }
    .modal-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .modal-buttons .primary-button, .modal-buttons .secondary-button { min-height: 62px; font-size: 20px; }
    .toast { position: fixed; z-index: 40; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 13px; width: min(500px, calc(100% - 40px)); padding: 16px 20px; border-radius: 14px; background: var(--azul); color: #fff; box-shadow: 0 12px 30px rgba(0,0,0,.22); font-size: 20px; font-weight: 800; }
    .toast-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--laranja); color: var(--azul); font-size: 22px; font-weight: 950; flex: 0 0 auto; }

    @media (max-width: 850px) {
      .topbar { align-items: flex-start; flex-direction: column; gap: 7px; }
      .context { max-width: 100%; text-align: left; }
      .page { width: min(100% - 30px, 720px); padding-top: 26px; }
      .choice-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .list-row { grid-template-columns: 1fr auto; }
      .row-time { grid-column: 1 / -1; }
      .row-end { grid-column: 2; grid-row: 2; }
    }
    @media (max-width: 560px) {
      .topbar { padding-left: 18px; padding-right: 18px; }
      .page { width: calc(100% - 24px); padding-bottom: 24px; }
      .panel, .record-hero, .status-card { padding: 20px 16px; }
      .choice-grid { grid-template-columns: 1fr; max-height: 52vh; }
      .condition-selectors, .day-summary { grid-template-columns: 1fr; }
      .condition-row { grid-template-columns: 1fr; }
      .condition-actions, .row-end { justify-content: flex-start; }
      .modal-buttons { grid-template-columns: 1fr; }
      .button-row.between { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script>

      As telas nunca armazenam nomes de catálogo diretamente: todas as listas são desenhadas a partir deste objeto.

      ],

        { nome: 'Alto-falante', detalhes: [

        ]},

        ]},

        ]},

          { nome: 'Cabo da bateria', defeitos: ['Mal encaixado', 'Invertido', 'Rompido'] },
          { nome: 'Cabo de dados', defeitos: ['Mal encaixado', 'Rompido', 'Descascado'] }
        ]},

    }
    function screenConditions() {
      return page('', `<div class="condition-page"><div class="button-row between"><div><h1 class="page-title">Condições da linha</h1><p class="page-lead">Marque um estado que precisa ficar visível para a equipe.</p></div>${backButton()}</div><div class="condition-selectors">${iconButton('leader', 'Operador em treinamento', 'condition-operators')}${iconButton('flag', 'Equipamento com defeito', 'condition-equipment')}</div><div class="panel"><h2 class="active-title">Condições ativas</h2><div>${activeConditionRows()}</div></div></div>`);
    }
    function screenConditionList(tipo) {
      const isOperator = tipo === 'operators';
      const items = isOperator ? DADOS.pessoas.filter(p => p.cargo === 'operador') : DADOS.equipamentos;
      return page('', `<div class="panel choice-panel"><p class="step-kicker">Condições da linha</p><h1 class="question">${isOperator ? 'Qual operador está em treinamento?' : 'Qual equipamento está com defeito?'}</h1>${grid(items, isOperator ? 'condition-operator' : 'condition-equipment-add', item => isOperator ? `${item.nome} · matrícula ${item.codigo}` : item)}<div class="button-row center footer-actions">${backButton()}</div></div>`);
    }
    function screenEnd() {
      const total = state.reparos.length;
      const open = state.reparos.filter(item => item.status === 'aberto').length;
      return page('', `<div class="end-day panel"><div class="button-row between"><div><h1 class="page-title">Encerrar o dia</h1><p class="page-lead">Confira o movimento antes de liberar a linha.</p></div>${backButton()}</div><div class="day-summary"><div class="summary-stat"><strong>${total}</strong><span>Reparos do dia</span></div><div class="summary-stat"><strong>${open}</strong><span>Em aberto</span></div></div><button class="primary-button full" data-action="close-day">Encerrar o dia</button></div>`);
    }
    function renderModal() {
      return `<div class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal-card"><h2>Digite seu código</h2><p class="helper">Confirme a ação no fim do registro.</p><div class="dots">${dots(state.codigoModal || '')}</div>${state.modalErro ? `<div class="modal-error">${escapeHtml(state.modalErro)}</div>` : ''}<div class="keypad">${keypad('modal')}</div><div class="modal-buttons"><button class="primary-button" data-action="confirm-code">Confirmar</button><button class="secondary-button" data-action="cancel-modal">Cancelar</button></div></div></div>`;
    }
    function render() {
      if (state.tela === 'menu') layout(screenMenu());
      else if (state.tela === 'auth') layout(screenAuth());
      else if (state.tela === 'setup') layout(screenSetup());
      else if (state.tela === 'record') layout(screenRecord());
      else if (state.tela === 'symptoms') layout(screenSymptoms());
      else if (state.tela === 'progress') layout(screenProgress());
      else if (state.tela === 'parts') layout(screenParts());
      else if (state.tela === 'details') layout(screenDetails());
      else if (state.tela === 'defects') layout(screenDefects());
      else if (state.tela === 'review') layout(screenReview());
      else if (state.tela === 'equipment') layout(screenEquipment());
      else if (state.tela === 'open') layout(screenOpen());
      else if (state.tela === 'history') layout(screenHistory());
      else if (state.tela === 'leader-options') layout(screenLeaderOptions());
      else if (state.tela === 'conditions') layout(screenConditions());
      else if (state.tela === 'condition-operators') layout(screenConditionList('operators'));
      else if (state.tela === 'condition-equipment') layout(screenConditionList('equipment'));
      else if (state.tela === 'end') layout(screenEnd());
      if (state.tela === 'progress' && state.reparo.rodando) startTimerRefresh();
      else stopTimerRefresh();
    }
    function goBack() {
      const routes = { auth: 'menu', setup: 'auth', symptoms: 'record', progress: 'symptoms', parts: 'progress', details: 'parts', defects: 'details', review: 'defects', equipment: 'record', open: 'menu', history: 'menu', 'leader-options': 'menu', conditions: 'leader-options', 'condition-operators': 'conditions', 'condition-equipment': 'conditions', end: 'leader-options' };
      state.tela = state.tela === 'parts' && state.reparo.registroId ? 'open' : (routes[state.tela] || 'menu');
      if (state.tela === 'auth') { state.matricula.valor = ''; state.matricula.erro = ''; }
      render();
    }
    function openAuth(finalidade) {
      state.matricula = { finalidade, valor: '', erro: '', aceita: false };
      state.tela = 'auth';
      render();
    }
    function handleKey(key, type) {
      if (type === 'auth') {
        if (key === 'Apagar') state.matricula.valor = state.matricula.valor.slice(0, -1);
        else if (key !== 'OK' && state.matricula.valor.length < 4) state.matricula.valor += key;
        else if (key === 'OK') validateAuth();
        state.matricula.erro = '';
        render();
      } else {
        if (key === 'Apagar') state.codigoModal = (state.codigoModal || '').slice(0, -1);
        else if (key !== 'OK' && (state.codigoModal || '').length < 4) state.codigoModal = (state.codigoModal || '') + key;
        else if (key === 'OK') confirmCode();
        state.modalErro = '';
        render();
      }
    }
    function validateAuth() {
      const person = pessoaPorCodigo(state.matricula.valor);
      if (!ehSuperior(person)) {
        state.matricula.erro = 'Esta matrícula não pode iniciar o dia';
        if (state.matricula.finalidade === 'lider') state.matricula.erro = 'Esta matrícula não tem acesso às opções do líder';
        return;
      }
      state.matricula.aceita = true;
      state.sessao.lider = person.nome;
      state.tela = state.matricula.finalidade === 'lider' ? 'leader-options' : 'setup';
      render();
    }
    function beginDay() {
      const line = document.getElementById('line-select')?.value || state.sessao.linha;
      const model = document.getElementById('model-select')?.value || state.sessao.modelo;
      const found = DADOS.modelos.find(item => item.nome === model) || DADOS.modelos[0];
      state.sessao = { linha: line, modelo: found.nome, ordem: found.ordem, lider: state.sessao.lider };
      state.diaIniciado = true;
      state.tela = 'record';
      render();
    }
    function startRepair() {
      state.selecao = { sintoma: '', peca: '', detalhe: '', defeito: '' };
      state.reparo = { abertoEm: Date.now(), cronometro: 0, rodando: false, iniciouEm: null, registroId: null };
      state.tela = 'symptoms';
      render();
    }
    function chooseSymptom(value) { state.selecao.sintoma = value; requestConfirmation('start'); }
    function toggleTimer() {
      if (state.reparo.rodando) {
        state.reparo.cronometro += Math.floor((Date.now() - state.reparo.iniciouEm) / 1000);
        state.reparo.rodando = false;
        state.reparo.iniciouEm = null;
      } else {
        state.reparo.rodando = true;
        state.reparo.iniciouEm = Date.now();
      }
      render();
    }
    function elapsedNow() { return state.reparo.cronometro + (state.reparo.rodando && state.reparo.iniciouEm ? Math.floor((Date.now() - state.reparo.iniciouEm) / 1000) : 0); }
    function stopTimer() { if (state.reparo.rodando) { state.reparo.cronometro = elapsedNow(); state.reparo.rodando = false; state.reparo.iniciouEm = null; } }
    function startTimerRefresh() {
      stopTimerRefresh();
      timerHandle = setInterval(() => { const target = document.getElementById('live-timer'); if (target) target.textContent = `${formatarTempo(elapsedNow())} s`; }, 1000);
    }
    function stopTimerRefresh() { if (timerHandle) clearInterval(timerHandle); timerHandle = null; }
    function beginFinalize() { stopTimer(); state.tela = 'parts'; render(); }
    function choosePart(value) { state.selecao.peca = value; state.selecao.detalhe = ''; state.selecao.defeito = ''; state.tela = 'details'; render(); }
    function chooseDetail(value) { state.selecao.detalhe = value; state.selecao.defeito = ''; state.tela = 'defects'; render(); }
    function chooseDefect(value) { state.selecao.defeito = value; state.tela = 'review'; render(); }
    function requestConfirmation(type, extras = {}) {
      state.codigoModal = '';
      state.modalErro = '';
      state.acaoPendente = { type, ...extras };
      state.modal = true;
      render();
    }
    function finalizeReview() {
      const input = document.getElementById('repair-time');
      const typed = input ? input.value : '';
      state.reparo.cronometro = typed === '' ? 0 : Math.max(0, Number(typed));
      requestConfirmation('finalize', { existingId: state.reparo.registroId });
    }
    function createRecord(status, personName) {
      const id = `r${Date.now()}`;
      const record = { id, abertoEm: state.reparo.abertoEm || Date.now(), sintoma: state.selecao.sintoma, linha: state.sessao.linha, modelo: state.sessao.modelo, ordem: state.sessao.ordem, status, tempo: state.reparo.cronometro || null, operador: personName, peca: status === 'finalizado' ? state.selecao.peca : null, detalhe: status === 'finalizado' ? state.selecao.detalhe : null, defeito: status === 'finalizado' ? state.selecao.defeito : null };
      state.reparos.push(record);
      return record;
    }
    function registerEquipment(name, person) {
      state.condicoes.unshift({ id: `c${Date.now()}`, tipo: 'equipamento', nome: name, detalhe: 'Equipamento com defeito', inicio: hora(Date.now()), aguardando: person.cargo === 'operador', ativa: true });
    }
    function confirmCode() {
      const person = pessoaPorCodigo(state.codigoModal || '');
      if (!person) { state.modalErro = 'Código não encontrado'; render(); return; }
      const pending = state.acaoPendente;
      if (!pending) return;
      if (pending.type === 'start') {
        const created = createRecord('aberto', person.nome);
        state.reparo.registroId = created.id;
      }
      if (pending.type === 'keep-open') {
        state.reparo.registroId = state.reparo.registroId || state.reparos.find(item => item.abertoEm === state.reparo.abertoEm)?.id || null;
      }
      if (pending.type === 'finalize') {
        if (pending.existingId) {
          const found = state.reparos.find(item => item.id === pending.existingId);
          if (found) Object.assign(found, { status: 'finalizado', tempo: state.reparo.cronometro || null, operador: person.nome, peca: state.selecao.peca, detalhe: state.selecao.detalhe, defeito: state.selecao.defeito });
        } else createRecord('finalizado', person.nome);
      }
      if (pending.type === 'equipment') registerEquipment(state.equipamentoEscolhido, person);
      state.modal = false;
      state.acaoPendente = null;
      state.aviso = `Registrado por ${person.nome}`;
      state.tela = pending.type === 'start' ? 'progress' : 'record';
      render();
      clearTimeout(noticeHandle);
      noticeHandle = setTimeout(() => { state.aviso = ''; render(); }, 2000);
    }
    function leaveOpen() { stopTimer(); requestConfirmation('keep-open'); }
    function chooseEquipment(value) { state.equipamentoEscolhido = value; requestConfirmation('equipment'); }
    function finalizeExisting(id) {
      const found = state.reparos.find(item => item.id === id);
      if (!found) return;
      state.reparo = { abertoEm: found.abertoEm, cronometro: found.tempo || 0, rodando: false, iniciouEm: null, registroId: id };
      state.selecao = { sintoma: found.sintoma, peca: '', detalhe: '', defeito: '' };
      state.tela = 'parts';
      render();
    }
    function addCondition(kind, value) {
      const label = kind === 'operator' ? value.split(' · ')[0] : value;
      state.condicoes.unshift({ id: `c${Date.now()}`, tipo: kind, nome: label, detalhe: kind === 'operator' ? 'Operador em treinamento' : 'Equipamento com defeito', inicio: hora(Date.now()), aguardando: false, ativa: true });
      state.tela = 'conditions';
      render();
    }
    function previewSetup() {
      const p = new URLSearchParams(location.search).get('preview');
      if (!p || state.previewAplicado) return;
      state.previewAplicado = true;
      state.diaIniciado = true;
      if (p === 'menu') state.diaIniciado = false;
      if (p === 'menu') state.tela = 'menu';
      if (p === 'start') { state.diaIniciado = false; state.tela = 'auth'; state.matricula.finalidade = 'inicio'; }
      if (p === 'record') state.tela = 'record';
      if (p === 'final') { state.selecao = { sintoma: 'Não ligou', peca: 'Placa', detalhe: 'Placa do módulo', defeito: '' }; state.tela = 'defects'; }
      if (p === 'confirm') { state.selecao = { sintoma: 'Não ligou', peca: 'Placa', detalhe: 'Placa do módulo', defeito: 'Componente queimado' }; state.reparo.cronometro = 372; state.tela = 'review'; state.codigoModal = ''; state.modalErro = ''; state.acaoPendente = { type: 'finalize' }; state.modal = true; }
      if (p === 'open') state.tela = 'open';
      if (p === 'history') state.tela = 'history';
      if (p === 'conditions') state.tela = 'conditions';
      if (p === 'end') state.tela = 'end';
    }
    function bindActions() {
      document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => {
        const action = button.dataset.action;
        if (action === 'start-auth') openAuth('inicio');
        else if (action === 'leader-auth') openAuth('lider');
        else if (action === 'menu') { state.tela = 'menu'; render(); }
        else if (action === 'history') { state.tela = 'history'; render(); }
        else if (action === 'open') { state.tela = 'open'; render(); }
        else if (action === 'record') { state.tela = 'record'; render(); }
        else if (action === 'equipment') { state.tela = 'equipment'; render(); }
        else if (action === 'open-repair') startRepair();
        else if (action === 'begin-day') beginDay();
        else if (action === 'toggle-timer') toggleTimer();
        else if (action === 'start-finalize') beginFinalize();
        else if (action === 'leave-open') leaveOpen();
        else if (action === 'finalize-review') finalizeReview();
        else if (action === 'back') goBack();
        else if (action === 'leader-options') openAuth('lider');
        else if (action === 'conditions') { state.tela = 'conditions'; render(); }
        else if (action === 'end-day') { state.tela = 'end'; render(); }
        else if (action === 'condition-operators') { state.tela = 'condition-operators'; render(); }
        else if (action === 'condition-equipment') { state.tela = 'condition-equipment'; render(); }
        else if (action === 'close-day') { state.diaIniciado = false; state.tela = 'menu'; render(); }
        else if (action === 'confirm-code') confirmCode();
        else if (action === 'cancel-modal') { state.modal = false; state.acaoPendente = null; state.modalErro = ''; render(); }
      }));
      document.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => handleKey(button.dataset.key, button.dataset.keyType)));
      document.querySelectorAll('[data-choice]').forEach(button => button.addEventListener('click', () => {
        const action = button.dataset.choice;
        const value = button.dataset.value;
        if (action === 'symptom') chooseSymptom(value);
        else if (action === 'part') choosePart(value);
        else if (action === 'detail') chooseDetail(value);
        else if (action === 'defect') chooseDefect(value);
        else if (action === 'equipment-choice') chooseEquipment(value);
        else if (action === 'condition-operator') addCondition('operator', value);
        else if (action === 'condition-equipment-add') addCondition('equipment', value);
      }));
      document.querySelectorAll('[data-open-repair]').forEach(button => button.addEventListener('click', () => finalizeExisting(button.dataset.openRepair)));
      document.querySelectorAll('[data-confirm-condition]').forEach(button => button.addEventListener('click', () => { const c = state.condicoes.find(item => item.id === button.dataset.confirmCondition); if (c) c.aguardando = false; render(); }));
      document.querySelectorAll('[data-end-condition]').forEach(button => button.addEventListener('click', () => { const c = state.condicoes.find(item => item.id === button.dataset.endCondition); if (c) c.ativa = false; render(); }));
      const modelSelect = document.getElementById('model-select');
      if (modelSelect) modelSelect.addEventListener('change', () => { state.sessao.modelo = modelSelect.value; state.sessao.ordem = DADOS.modelos.find(item => item.nome === modelSelect.value)?.ordem || ''; render(); });
    }

    previewSetup();
    render();
  </script>
</body>
</html>
